<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小四數學：直式乘法特工隊（混合題型與思維引導版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .digit-box {
      font-family: 'Chakra Petch', monospace;
      transition: all 0.2s ease;
    }

    .carry-box {
      font-family: 'Chakra Petch', monospace;
      font-weight: 900;
      font-size: 13px !important;
      line-height: 1;
      width: 22px !important;
      height: 22px !important;
      transition: all 0.2s ease;
    }

    .zero-pad-box {
      border-color: #f59e0b !important;
      background-color: #451a03 !important;
      color: #fbbf24 !important;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    .highlight-target {
      background-color: #f59e0b !important;
      color: #000000 !important;
      font-weight: 900;
      transform: scale(1.08);
      box-shadow: 0 0 18px #f59e0b;
      z-index: 20;
      border-color: #fbbf24 !important;
      animation: pulse-glow 1.2s infinite alternate;
    }

    .highlight-active-input {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 18px #38bdf8, inset 0 0 12px rgba(56, 189, 248, 0.4);
      background-color: #0f172a !important;
      color: #38bdf8 !important;
      animation: border-pulse 1s infinite alternate;
    }

    .highlight-zero-input {
      border-color: #fbbf24 !important;
      box-shadow: 0 0 20px #fbbf24, inset 0 0 12px rgba(251, 191, 36, 0.6);
      background-color: #78350f !important;
      color: #fef08a !important;
      transform: scale(1.05);
      animation: border-pulse-yellow 1s infinite alternate;
    }

    .highlight-carry-input {
      border-color: #ec4899 !important;
      box-shadow: 0 0 16px #ec4899, inset 0 0 10px rgba(236, 72, 153, 0.7);
      background-color: #831843 !important;
      color: #f472b6 !important;
      transform: scale(1.15);
      z-index: 30;
      animation: border-pulse-pink 1s infinite alternate;
    }

    .highlight-carry-used {
      background-color: #db2777 !important;
      color: #ffffff !important;
      font-weight: 900;
      box-shadow: 0 0 12px #ec4899;
    }

    /* 隱藏無用欄位 */
    .col-hidden {
      visibility: hidden !important;
      pointer-events: none !important;
    }

    @keyframes pulse-glow {
      0% { transform: scale(1.04); box-shadow: 0 0 12px #f59e0b; }
      100% { transform: scale(1.1); box-shadow: 0 0 22px #f59e0b; }
    }

    @keyframes border-pulse {
      0% { border-color: #0284c7; }
      100% { border-color: #38bdf8; box-shadow: 0 0 20px #38bdf8; }
    }

    @keyframes border-pulse-yellow {
      0% { border-color: #d97706; }
      100% { border-color: #f59e0b; box-shadow: 0 0 20px #f59e0b; }
    }

    @keyframes border-pulse-pink {
      0% { border-color: #be185d; }
      100% { border-color: #f472b6; box-shadow: 0 0 18px #f472b6; }
    }

    .ipad-btn {
      touch-action: manipulation;
      transition: all 0.08s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .ipad-btn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-5 bg-slate-900 text-slate-100">

  <!-- 頂部列 -->
  <header class="w-full max-w-5xl flex flex-wrap justify-between items-center bg-slate-800/90 border border-slate-700 p-3 sm:p-4 rounded-2xl shadow-xl mb-3">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-amber-500/30">
        <i class="fa-solid fa-calculator"></i>
      </div>
      <div>
        <h1 class="font-black text-lg sm:text-xl text-amber-400 tracking-wide flex items-center gap-2">
          乘法特工隊 <span id="mode-badge" class="text-xs px-2 py-0.5 rounded-full bg-indigo-600 text-white font-normal">混合題型模式</span>
        </h1>
        <p class="text-xs text-slate-400">觀察黃色亮起位置，自行運算並填入答案</p>
      </div>
    </div>

    <div class="flex items-center gap-3 mt-2 sm:mt-0">
      <div class="bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700 flex items-center gap-2">
        <i class="fa-solid fa-trophy text-amber-400 text-sm"></i>
        <span class="text-xs text-slate-400">得分:</span>
        <span id="score-display" class="font-bold text-amber-400 text-base">0</span>
      </div>
      <div class="bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700 flex items-center gap-2">
        <i class="fa-solid fa-bolt text-cyan-400 text-sm"></i>
        <span class="text-xs text-slate-400">連對:</span>
        <span id="streak-display" class="font-bold text-cyan-400 text-base">0</span>
      </div>
      <button onclick="initNewGame(false)" class="ipad-btn bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-lg shadow-indigo-600/30 flex items-center gap-1.5">
        <i class="fa-solid fa-rotate-right"></i> 換題
      </button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-4 items-start my-auto">

    <!-- 左側：題目指引與直式計算表格 -->
    <section class="lg:col-span-7 bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-2xl flex flex-col items-center">

      <!-- 思考指引卡 (不顯露答案) -->
      <div class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3 mb-3">
        <div class="flex items-center justify-between pb-1.5 border-b border-slate-800 mb-2">
          <span id="step-badge" class="px-2.5 py-0.5 bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold text-xs rounded-full">
            步驟 1
          </span>
          <span id="equation-preview" class="font-mono text-sm font-bold text-amber-400 tracking-wider">
            <!-- 僅顯示目前運算的目標位值 -->
          </span>
        </div>
        <h2 id="step-title" class="text-base font-bold text-slate-100 flex items-center gap-2 mb-1">
          <!-- 思考方向 -->
        </h2>
        <p id="step-desc" class="text-xs text-slate-300 leading-relaxed">
          <!-- 思考引導提示 -->
        </p>
      </div>

      <!-- 直式表格區 -->
      <div class="relative py-2 px-3 bg-slate-950/70 rounded-2xl border border-slate-700/80 w-full max-w-lg">

        <div class="grid grid-cols-6 gap-1.5 text-center text-xl font-bold font-mono items-center">

          <!-- 位值標籤 -->
          <div id="hdr-ten-thousands" class="text-xs text-slate-500 font-normal py-0.5">萬</div>
          <div id="hdr-thousands" class="text-xs text-slate-500 font-normal py-0.5">千</div>
          <div class="text-xs text-slate-500 font-normal py-0.5">百</div>
          <div class="text-xs text-slate-500 font-normal py-0.5">十</div>
          <div class="text-xs text-slate-500 font-normal py-0.5">個</div>
          <div class="text-xs text-slate-500 font-normal py-0.5"></div>

          <!-- 被乘數列 -->
          <div id="box-top-ten-thousands"></div>
          <div id="box-top-thousands"></div>
          <div class="w-full h-11 flex items-center justify-center">
            <div id="top-hundreds" class="digit-box w-full h-full rounded-lg bg-slate-800 border border-slate-700 text-slate-100 flex items-center justify-center">3</div>
          </div>
          <div class="w-full h-11 flex items-center justify-center">
            <div id="top-tens" class="digit-box w-full h-full rounded-lg bg-slate-800 border border-slate-700 text-slate-100 flex items-center justify-center">4</div>
          </div>
          <div class="w-full h-11 flex items-center justify-center">
            <div id="top-units" class="digit-box w-full h-full rounded-lg bg-slate-800 border border-slate-700 text-slate-100 flex items-center justify-center">5</div>
          </div>
          <div></div>

          <!-- 乘數列 -->
          <div class="text-amber-400 font-extrabold flex items-center justify-center">×</div>
          <div></div>
          <div></div>
          <div class="w-full h-11 flex items-center justify-center">
            <div id="bottom-tens" class="digit-box w-full h-full rounded-lg bg-slate-800 border border-slate-700 text-slate-100 flex items-center justify-center">6</div>
          </div>
          <div class="w-full h-11 flex items-center justify-center">
            <div id="bottom-units" class="digit-box w-full h-full rounded-lg bg-slate-800 border border-slate-700 text-slate-100 flex items-center justify-center">7</div>
          </div>
          <div></div>

          <!-- 第一條橫線 -->
          <div class="col-span-6 h-0.5 bg-slate-600 my-0.5 rounded-full"></div>

          <!-- 第一層結果 (十位乘積) -->
          <div class="relative w-full h-11" id="wrap-r1-ten-thousands">
            <input id="c-r1-thousands" type="text" readonly class="carry-box absolute top-0.5 right-0.5 text-center rounded bg-slate-900 border border-pink-500/60 text-pink-300 focus:outline-none z-10" />
            <input id="ans-r1-ten-thousands" type="text" readonly class="digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-cyan-300 focus:outline-none" />
          </div>
          <div class="relative w-full h-11" id="wrap-r1-thousands">
            <input id="c-r1-hundreds" type="text" readonly class="carry-box absolute top-0.5 right-0.5 text-center rounded bg-slate-900 border border-pink-500/60 text-pink-300 focus:outline-none z-10" />
            <input id="ans-r1-thousands" type="text" readonly class="digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-cyan-300 focus:outline-none" />
          </div>
          <div class="relative w-full h-11">
            <input id="c-r1-tens" type="text" readonly class="carry-box absolute top-0.5 right-0.5 text-center rounded bg-slate-900 border border-pink-500/60 text-pink-300 focus:outline-none z-10" />
            <input id="ans-r1-hundreds" type="text" readonly class="digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-cyan-300 focus:outline-none" />
          </div>
          <div class="relative w-full h-11">
            <input id="ans-r1-tens" type="text" readonly class="digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-cyan-300 focus:outline-none" />
          </div>
          <div class="w-full h-11">
            <input id="ans-r1-units" type="text" readonly class="digit-box w-full h-full text-center rounded-lg zero-pad-box font-black text-2xl focus:outline-none" />
          </div>
          <div id="lbl-r1" class="text-xs text-slate-400 flex items-center justify-start pl-1 font-sans">×60</div>

          <!-- 第二層結果 (個位乘積) -->
          <div class="relative w-full h-11" id="wrap-r2-ten-thousands">
            <input id="ans-r2-ten-thousands" type="text" readonly class="digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-cyan-300 focus:outline-none" />
          </div>
          <div class="relative w-full h-11" id="wrap-r2-thousands">
            <input id="c-r2-hundreds" type="text" readonly class="carry-box absolute top-0.5 right-0.5 text-center rounded bg-slate-900 border border-pink-500/60 text-pink-300 focus:outline-none z-10" />
            <input id="ans-r2-thousands" type="text" readonly class="digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-cyan-300 focus:outline-none" />
          </div>
          <div class="relative w-full h-11">
            <input id="c-r2-tens" type="text" readonly class="carry-box absolute top-0.5 right-0.5 text-center rounded bg-slate-900 border border-pink-500/60 text-pink-300 focus:outline-none z-10" />
            <input id="ans-r2-hundreds" type="text" readonly class="digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-cyan-300 focus:outline-none" />
          </div>
          <div class="relative w-full h-11">
            <input id="c-r2-units" type="text" readonly class="carry-box absolute top-0.5 right-0.5 text-center rounded bg-slate-900 border border-pink-500/60 text-pink-300 focus:outline-none z-10" />
            <input id="ans-r2-tens" type="text" readonly class="digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-cyan-300 focus:outline-none" />
          </div>
          <div class="w-full h-11">
            <input id="ans-r2-units" type="text" readonly class="digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-cyan-300 focus:outline-none" />
          </div>
          <div id="lbl-r2" class="text-xs text-slate-400 flex items-center justify-start pl-1 font-sans">×7</div>

          <!-- 第二條加法線 -->
          <div class="col-span-6 h-0.5 bg-slate-600 my-0.5 rounded-full"></div>

          <!-- 最終加總結果 -->
          <div class="relative w-full h-11" id="wrap-final-ten-thousands">
            <input id="c-sum-thousands" type="text" readonly class="carry-box absolute top-0.5 right-0.5 text-center rounded bg-slate-900 border border-amber-500/70 text-amber-300 focus:outline-none z-10" />
            <input id="ans-final-ten-thousands" type="text" readonly class="digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-emerald-400 focus:outline-none" />
          </div>
          <div class="relative w-full h-11" id="wrap-final-thousands">
            <input id="c-sum-hundreds" type="text" readonly class="carry-box absolute top-0.5 right-0.5 text-center rounded bg-slate-900 border border-amber-500/70 text-amber-300 focus:outline-none z-10" />
            <input id="ans-final-thousands" type="text" readonly class="digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-emerald-400 focus:outline-none" />
          </div>
          <div class="relative w-full h-11">
            <input id="c-sum-tens" type="text" readonly class="carry-box absolute top-0.5 right-0.5 text-center rounded bg-slate-900 border border-amber-500/70 text-amber-300 focus:outline-none z-10" />
            <input id="ans-final-hundreds" type="text" readonly class="digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-emerald-400 focus:outline-none" />
          </div>
          <div class="relative w-full h-11">
            <input id="c-sum-units" type="text" readonly class="carry-box absolute top-0.5 right-0.5 text-center rounded bg-slate-900 border border-amber-500/70 text-amber-300 focus:outline-none z-10" />
            <input id="ans-final-tens" type="text" readonly class="digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-emerald-400 focus:outline-none" />
          </div>
          <div class="w-full h-11">
            <input id="ans-final-units" type="text" readonly class="digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-emerald-400 focus:outline-none" />
          </div>
          <div class="text-xs text-emerald-400 font-bold flex items-center justify-start pl-1">加總</div>

        </div>
      </div>
    </section>

    <!-- 右側：iPad 大按鈕數字鍵盤 -->
    <section class="lg:col-span-5 bg-slate-800/90 border border-slate-700 rounded-2xl p-4 shadow-2xl flex flex-col justify-center items-center h-full">
      <div class="w-full text-center mb-2">
        <span class="text-xs text-slate-400 font-bold"><i class="fa-solid fa-hand-pointer text-amber-400"></i> 請使用螢幕鍵盤輸入數字</span>
      </div>

      <div class="w-full max-w-xs grid grid-cols-3 gap-3">
        <button onclick="pressNum('1')" class="ipad-btn bg-slate-700 hover:bg-slate-600 text-white font-black h-16 rounded-2xl border-2 border-slate-600 text-2xl shadow-lg active:bg-slate-500">1</button>
        <button onclick="pressNum('2')" class="ipad-btn bg-slate-700 hover:bg-slate-600 text-white font-black h-16 rounded-2xl border-2 border-slate-600 text-2xl shadow-lg active:bg-slate-500">2</button>
        <button onclick="pressNum('3')" class="ipad-btn bg-slate-700 hover:bg-slate-600 text-white font-black h-16 rounded-2xl border-2 border-slate-600 text-2xl shadow-lg active:bg-slate-500">3</button>
        
        <button onclick="pressNum('4')" class="ipad-btn bg-slate-700 hover:bg-slate-600 text-white font-black h-16 rounded-2xl border-2 border-slate-600 text-2xl shadow-lg active:bg-slate-500">4</button>
        <button onclick="pressNum('5')" class="ipad-btn bg-slate-700 hover:bg-slate-600 text-white font-black h-16 rounded-2xl border-2 border-slate-600 text-2xl shadow-lg active:bg-slate-500">5</button>
        <button onclick="pressNum('6')" class="ipad-btn bg-slate-700 hover:bg-slate-600 text-white font-black h-16 rounded-2xl border-2 border-slate-600 text-2xl shadow-lg active:bg-slate-500">6</button>
        
        <button onclick="pressNum('7')" class="ipad-btn bg-slate-700 hover:bg-slate-600 text-white font-black h-16 rounded-2xl border-2 border-slate-600 text-2xl shadow-lg active:bg-slate-500">7</button>
        <button onclick="pressNum('8')" class="ipad-btn bg-slate-700 hover:bg-slate-600 text-white font-black h-16 rounded-2xl border-2 border-slate-600 text-2xl shadow-lg active:bg-slate-500">8</button>
        <button onclick="pressNum('9')" class="ipad-btn bg-slate-700 hover:bg-slate-600 text-white font-black h-16 rounded-2xl border-2 border-slate-600 text-2xl shadow-lg active:bg-slate-500">9</button>

        <button onclick="pressNum('0')" class="ipad-btn bg-amber-500 hover:bg-amber-400 text-slate-950 font-black h-16 rounded-2xl border-2 border-amber-400 text-2xl shadow-lg col-span-2 flex items-center justify-center gap-2 active:bg-amber-300">
          <span>0</span> <span class="text-xs font-normal bg-slate-950/20 px-2 py-0.5 rounded-md text-slate-900">補位零</span>
        </button>
        <button onclick="pressBackspace()" class="ipad-btn bg-rose-600 hover:bg-rose-500 text-white font-bold h-16 rounded-2xl border-2 border-rose-500 text-xl shadow-lg flex items-center justify-center active:bg-rose-400">
          <i class="fa-solid fa-delete-left text-2xl"></i>
        </button>
      </div>
    </section>
  </main>

  <!-- 成功通關彈窗 -->
  <div id="success-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <div class="bg-slate-800 border-2 border-amber-400 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl transform transition-all scale-95 opacity-0" id="modal-card">
      <div class="w-16 h-16 bg-amber-500 rounded-full flex items-center justify-center text-slate-950 text-3xl font-black mx-auto mb-3 shadow-lg shadow-amber-500/40 animate-bounce">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <h3 class="text-2xl font-black text-amber-400 mb-1">計算完成！</h3>
      <p class="text-xs text-slate-300 mb-4">邏輯清晰，獨立思考挑戰成功！</p>

      <div class="bg-slate-900 rounded-xl p-3 border border-slate-700 mb-5 text-left space-y-1.5">
        <div class="flex justify-between text-xs">
          <span class="text-slate-400">完成題目：</span>
          <span id="modal-equation" class="font-mono font-bold text-slate-200">345 × 67 = 23115</span>
        </div>
        <div class="flex justify-between text-xs">
          <span class="text-slate-400">當前得分：</span>
          <span id="modal-score" class="font-bold text-amber-400">+100</span>
        </div>
      </div>

      <button onclick="initNewGame(false)" class="ipad-btn w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl shadow-lg transition text-base">
        挑戰下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
      </button>
    </div>
  </div>

  <script>
    let is3Digit = true;
    let topNum = 345, bottomNum = 67;
    let topHundreds = 3, topTens = 4, topUnits = 5;
    let bottomTens = 6, bottomUnits = 7;

    let stepsSequence = [];
    let currentStepIdx = 0;
    let score = 0;
    let streak = 0;

    function initNewGame(isFirstLoad = false) {
      document.getElementById('success-modal').classList.add('hidden');

      if (isFirstLoad) {
        is3Digit = false; // 預設第一題為 2位數×2位數 練習
        topNum = 33; bottomNum = 37;
      } else {
        // 隨機決定題型：50% 機率三位數，50% 機率兩位數
        is3Digit = Math.random() > 0.5;
        if (is3Digit) {
          topNum = Math.floor(Math.random() * 899) + 101; // 101 ~ 999
        } else {
          topNum = Math.floor(Math.random() * 88) + 12;   // 12 ~ 99
        }
        bottomNum = Math.floor(Math.random() * 88) + 12; // 12 ~ 99
      }

      if (is3Digit) {
        topHundreds = Math.floor(topNum / 100);
        topTens = Math.floor((topNum % 100) / 10);
        topUnits = topNum % 10;
        document.getElementById('mode-badge').innerText = "三位數 × 兩位數";
        document.getElementById('mode-badge').className = "text-xs px-2 py-0.5 rounded-full bg-purple-600 text-white font-normal";
        document.getElementById('top-hundreds').classList.remove('col-hidden');
        document.getElementById('hdr-ten-thousands').innerText = "萬";
        document.getElementById('hdr-thousands').innerText = "千";
      } else {
        topHundreds = 0;
        topTens = Math.floor(topNum / 10);
        topUnits = topNum % 10;
        document.getElementById('mode-badge').innerText = "兩位數 × 兩位數";
        document.getElementById('mode-badge').className = "text-xs px-2 py-0.5 rounded-full bg-indigo-600 text-white font-normal";

        document.getElementById('hdr-ten-thousands').innerText = "";

      }

      bottomTens = Math.floor(bottomNum / 10);
      bottomUnits = bottomNum % 10;

      document.getElementById('top-hundreds').innerText = is3Digit ? topHundreds : '';
      document.getElementById('top-tens').innerText = topTens;
      document.getElementById('top-units').innerText = topUnits;
      document.getElementById('bottom-tens').innerText = bottomTens;
      document.getElementById('bottom-units').innerText = bottomUnits;

      document.getElementById('lbl-r1').innerText = `×${bottomTens*10}`;
      document.getElementById('lbl-r2').innerText = `×${bottomUnits}`;

      // 欄位顯示/隱藏控制
      toggleColumnVisibility('wrap-r1-ten-thousands', is3Digit);
      toggleColumnVisibility('wrap-r2-ten-thousands', is3Digit);
      toggleColumnVisibility('wrap-final-ten-thousands', is3Digit || (topNum * bottomNum >= 10000));

      const inputs = document.querySelectorAll('input');
      inputs.forEach(input => {
        input.value = '';
        if (input.classList.contains('carry-box')) {
          input.className = "carry-box absolute top-0.5 right-0.5 text-center rounded bg-slate-900 border border-slate-700 text-pink-400 focus:outline-none z-10";
        } else if (input.classList.contains('zero-pad-box')) {
          input.className = "digit-box w-full h-full text-center rounded-lg zero-pad-box font-black text-2xl focus:outline-none";
        } else {
          input.className = "digit-box w-full h-full text-center rounded-lg bg-slate-900 border border-slate-700 text-cyan-300 focus:outline-none";
        }
      });

      buildStepsSequence();
      currentStepIdx = 0;
      updateStepUI();
    }

    function toggleColumnVisibility(id, visible) {

    }

    function pressNum(numStr) {
      if (currentStepIdx >= stepsSequence.length) return;

      const currentStep = stepsSequence[currentStepIdx];
      const targetInput = document.getElementById(currentStep.inputElId);

      if (numStr === currentStep.expected.toString()) {
        targetInput.value = numStr;
        targetInput.classList.remove('highlight-active-input', 'highlight-carry-input', 'highlight-zero-input');

        if (currentStep.inputElId.startsWith('c-sum')) {
          targetInput.classList.add('bg-amber-950', 'border-amber-400', 'text-amber-300');
        } else if (currentStep.inputElId.startsWith('c-')) {
          targetInput.classList.add('bg-pink-950', 'border-pink-400', 'text-pink-300');
        } else if (currentStep.inputElId.startsWith('ans-final')) {
          targetInput.classList.add('bg-emerald-950', 'border-emerald-500', 'text-emerald-400');
        } else if (currentStep.isZeroStep) {
          targetInput.classList.add('bg-amber-500', 'text-slate-950', 'border-amber-400');
        } else {
          targetInput.classList.add('bg-cyan-950', 'border-cyan-500', 'text-cyan-300');
        }

        currentStepIdx++;
        if (currentStepIdx >= stepsSequence.length) {
          gameSuccess();
        } else {
          updateStepUI();
        }
      } else {
        targetInput.classList.add('border-rose-500', 'bg-rose-950/80');
        setTimeout(() => {
          targetInput.classList.remove('border-rose-500', 'bg-rose-950/80');
        }, 500);
      }
    }

    function pressBackspace() {
      if (currentStepIdx < stepsSequence.length) {
        const currentStep = stepsSequence[currentStepIdx];
        const targetInput = document.getElementById(currentStep.inputElId);
        if (targetInput) targetInput.value = '';
      }
    }

    function updateStepUI() {
      document.querySelectorAll('.digit-box, input').forEach(el => {
        el.classList.remove('highlight-target', 'highlight-active-input', 'highlight-carry-input', 'highlight-carry-used', 'highlight-zero-input');
      });

      const currentStep = stepsSequence[currentStepIdx];

      document.getElementById('step-badge').innerText = `步驟 ${currentStepIdx + 1} / ${stepsSequence.length}`;
      document.getElementById('step-title').innerHTML = `<i class="fa-solid fa-lightbulb text-amber-400"></i> ${currentStep.title}`;
      document.getElementById('step-desc').innerText = currentStep.desc;
      document.getElementById('equation-preview').innerText = currentStep.eq;

      if (currentStep.targets) {
        currentStep.targets.forEach(id => {
          const el = document.getElementById(id);
          if (el) el.classList.add('highlight-target');
        });
      }

      if (currentStep.usedCarryId) {
        const cEl = document.getElementById(currentStep.usedCarryId);
        if (cEl) cEl.classList.add('highlight-carry-used');
      }

      const activeInput = document.getElementById(currentStep.inputElId);
      if (activeInput) {
        if (currentStep.isZeroStep) {
          activeInput.classList.add('highlight-zero-input');
        } else if (currentStep.inputElId.startsWith('c-')) {
          activeInput.classList.add('highlight-carry-input');
        } else {
          activeInput.classList.add('highlight-active-input');
        }
      }
    }

    function gameSuccess() {
      score += 100;
      streak++;

      document.getElementById('score-display').innerText = score;
      document.getElementById('streak-display').innerText = streak;

      document.getElementById('modal-equation').innerText = `${topNum} × ${bottomNum} = ${topNum * bottomNum}`;
      document.getElementById('modal-score').innerText = `+100分 (連勝 ${streak} 題)`;

      const modal = document.getElementById('success-modal');
      const modalCard = document.getElementById('modal-card');

      modal.classList.remove('hidden');
      setTimeout(() => {
        modalCard.classList.remove('scale-95', 'opacity-0');
        modalCard.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    window.onload = () => {
      initNewGame(true);
    };
  </script>
</body>
</html>
